<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Tree</title>
<style>
  :root {
    /* Typography */
    --font-ui: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

    /* Base palette */
    --bg: #ffffff;
    --ink: #111111;

    /* Lines and interaction */
    --line-width: 2px;
    --line: var(--line-width) solid var(--ink);
    --hover-bg: #f6f7f4;

    /* Toggle states */
    --state-winter: #ddeeff;
    --state-night: #224488;
    --state-forest: #44aa22;
    --state-language: #f2f5f9;

    /* Control layout */
    --button-size: clamp(58px, 9.5vh, 72px);
    --button-gap: clamp(10px, 2.2vh, 18px);
    --enter-gap: clamp(26px, 4.8vh, 44px);
    --icon-size: clamp(24px, 4.2vh, 32px);
    --glyph-size: clamp(20px, 3.8vh, 28px);

    /* Color picker */
    --custom-default: #ffbbaa;
    --picker-width: min(300px, calc(100vw - 48px));
    --picker-padding: 14px;
    --picker-gap: 12px;
    --hex-height: 38px;
    --hex-font-size: 16px;
    --overlay-bg: rgba(255, 255, 255, 0.78);
    --panel-shadow: 0 24px 64px rgba(17, 17, 17, 0.18);
    --close-shadow: 0 4px 14px rgba(17, 17, 17, 0.16);
    --thumb-shadow: 0 0 0 1px rgba(17, 17, 17, 0.55), 0 2px 6px rgba(17, 17, 17, 0.24);
    --picker-hue: #ff0000;
    --thumb-color: var(--custom-default);
    --thumb-x: 50%;
    --thumb-y: 50%;
    --hue-pos: 0%;
    --custom-color: var(--custom-default);
    --custom-icon-color: var(--ink);
    --hue-spectrum: linear-gradient(90deg, #ff0000 0%, #ffff00 16.67%, #00ff00 33.33%, #00ffff 50%, #0000ff 66.67%, #ff00ff 83.33%, #ff0000 100%);
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    font-family: var(--font-ui);
  }
  body.color-picker-open {
    overflow: hidden;
  }

  /* Controls */
  .icon-defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--button-gap);
  }
  .circle-button {
    position: relative;
    display: grid;
    place-items: center;
    width: var(--button-size);
    height: var(--button-size);
    padding: 0;
    border: var(--line);
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .circle-button:hover { background: var(--hover-bg); }
  .circle-button:focus-visible {
    outline: var(--line);
    outline-offset: 3px;
  }
  .circle-button[data-action="enter"] {
    margin-top: var(--enter-gap);
  }
  .icon {
    width: var(--icon-size);
    height: var(--icon-size);
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-on { display: none; }

  .circle-button.is-on .icon-off { display: none; }
  .circle-button.is-on .icon-on { display: block; }

  .circle-button[data-action="winter"].is-on {
    background: var(--state-winter);
    color: var(--ink);
  }
  .circle-button[data-action="night"].is-on {
    background: var(--state-night);
    color: var(--bg);
  }
  .circle-button[data-action="forest"].is-on {
    background: var(--state-forest);
    color: var(--ink);
  }
  .circle-button[data-action="custom"].is-on {
    background: var(--custom-color);
    color: var(--custom-icon-color);
  }
  .circle-button[data-action="lang"].is-on {
    background: var(--state-language);
    color: var(--ink);
  }

  .glyph {
    font-family: var(--font-ui);
    font-size: var(--glyph-size);
    font-weight: 400;
    line-height: 1;
  }
  /* Color picker */
  .color-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--overlay-bg);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .color-overlay[hidden] {
    display: none;
  }
  .color-panel {
    position: relative;
    width: var(--picker-width);
    padding: var(--picker-padding);
    border: var(--line);
    border-radius: 20px;
    background: var(--bg);
    box-shadow: var(--panel-shadow);
  }
  .color-sv {
    position: relative;
    width: 100%;
    aspect-ratio: 1.35;
    border: var(--line);
    border-radius: 12px;
    background:
      linear-gradient(to top, var(--ink), transparent),
      linear-gradient(to right, var(--bg), var(--picker-hue));
    cursor: crosshair;
    touch-action: none;
  }
  .color-sv:focus-visible {
    outline: var(--line);
    outline-offset: 3px;
  }
  .color-sv-thumb {
    position: absolute;
    left: var(--thumb-x);
    top: var(--thumb-y);
    width: 20px;
    height: 20px;
    border: 2px solid var(--bg);
    border-radius: 50%;
    background: var(--thumb-color);
    box-shadow: var(--thumb-shadow);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .hue-control {
    position: relative;
    height: 28px;
    margin-top: var(--picker-gap);
  }
  .hue-control:focus-within {
    outline: var(--line);
    outline-offset: 3px;
    border-radius: 999px;
  }
  .hue-track {
    position: absolute;
    left: 0;
    right: 0;
    top: 5px;
    height: 18px;
    border: var(--line);
    border-radius: 999px;
    background: var(--hue-spectrum);
  }
  .hue-thumb-layer {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 0;
    bottom: 0;
    pointer-events: none;
  }
  .hue-thumb {
    position: absolute;
    left: var(--hue-pos);
    top: 50%;
    width: 20px;
    height: 20px;
    border: 2px solid var(--bg);
    border-radius: 50%;
    background: var(--thumb-color);
    box-shadow: var(--thumb-shadow);
    transform: translate(-50%, -50%);
  }
  .hue-input {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    touch-action: none;
  }
  .hex-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: var(--hex-height);
    margin-top: var(--picker-gap);
    padding: 0 12px;
    border: var(--line);
    border-radius: 999px;
    background: var(--bg);
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
  }
  .hex-control:focus-within {
    outline: var(--line);
    outline-offset: 3px;
  }
  .hex-prefix {
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: var(--hex-font-size);
    line-height: 1;
  }
  .hex-input {
    width: 6.8ch;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: var(--hex-font-size);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .hex-input::selection {
    background: var(--state-winter);
    color: var(--ink);
  }
  .color-close {
    position: absolute;
    top: -14px;
    right: -14px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: var(--line);
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    box-shadow: var(--close-shadow);
    cursor: pointer;
  }
  .color-close:hover {
    background: var(--hover-bg);
  }
  .color-close:focus-visible {
    outline: var(--line);
    outline-offset: 3px;
  }
  .color-close .icon {
    width: 16px;
    height: 16px;
  }

  @media (max-height: 420px) {
    :root {
      --picker-width: min(260px, calc(100vw - 48px));
      --hex-height: 34px;
    }
    .color-sv {
      aspect-ratio: 1.55;
    }
    .hue-control {
      margin-top: 8px;
    }
    .hex-control {
      margin-top: 8px;
    }
  }
</style>
</head>
<body>

<main class="controls" aria-label="Tree parameters">
  <button class="circle-button" type="button" data-action="winter" aria-label="冬季" aria-pressed="false">
    <svg class="icon icon-off" aria-hidden="true"><use href="#icon-snowflake"></use></svg>

  <button class="circle-button" type="button" data-action="night" aria-label="夜晚" aria-pressed="false">

  <button class="circle-button" type="button" data-action="custom" aria-label="自定义颜色" aria-pressed="false" aria-haspopup="dialog" aria-expanded="false">

  </button>

  <button class="circle-button" type="button" data-action="lang" aria-label="语言" aria-pressed="false">
    <span class="glyph" aria-hidden="true">文</span>
  </button>

  </button>
</main>

<div class="color-overlay" id="color-overlay" hidden>
  <section class="color-panel" role="dialog" aria-modal="true" aria-label="自定义颜色">
    <button class="color-close" type="button" aria-label="关闭">
      <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
    </button>
    <div class="color-sv" id="color-sv" tabindex="0" role="group" aria-label="饱和度和明度">
      <span class="color-sv-thumb" aria-hidden="true"></span>
    </div>
    <div class="hue-control" id="hue-control">
      <div class="hue-track" aria-hidden="true"></div>
      <div class="hue-thumb-layer" aria-hidden="true">
        <span class="hue-thumb"></span>
      </div>
      <input class="hue-input" id="hue-input" type="range" min="0" max="359" step="1" value="0" aria-label="色相">
    </div>
    <label class="hex-control" for="hex-input">
      <span class="hex-prefix" aria-hidden="true">#</span>
      <input class="hex-input" id="hex-input" type="text" maxlength="7" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="characters" enterkeyhint="done" aria-label="十六进制颜色值">
    </label>
  </section>
</div>

<script>
(() => {
  const TREE_PAGE = 'tree.html';
  const state = {
    winter: false,
    night: false,
    forest: false,
    lang: false,
    color: null,
  };
  const controls = document.querySelector('.controls');
  const buttons = Array.from(document.querySelectorAll('.circle-button'));
  const customButton = document.querySelector('[data-action="custom"]');
  const langGlyph = document.querySelector('[data-action="lang"] .glyph');
  const overlay = document.getElementById('color-overlay');
  const colorPanel = document.querySelector('.color-panel');
  const colorSv = document.getElementById('color-sv');
  const hueControl = document.getElementById('hue-control');
  const hueInput = document.getElementById('hue-input');
  const hexInput = document.getElementById('hex-input');
  const closeColorButton = document.querySelector('.color-close');
  const rootStyle = getComputedStyle(document.documentElement);
  const contrastDark = rootStyle.getPropertyValue('--ink').trim();
  const contrastLight = rootStyle.getPropertyValue('--bg').trim();
  const customDefault = rootStyle.getPropertyValue('--custom-default').trim();

  let pickerHue = 0;
  let pickerSaturation = 0;
  let pickerValue = 0;

  function contrastIconColor(hex) {
    const value = hex.replace('#', '');
    const channels = [0, 2, 4].map((offset) => {
      const channel = parseInt(value.slice(offset, offset + 2), 16) / 255;
      return channel <= 0.03928
        ? channel / 12.92
        : Math.pow((channel + 0.055) / 1.055, 2.4);
    });
    const luminance = 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
    return luminance > 0.179 ? contrastDark : contrastLight;
  }

  const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
  const sanitizeHex = (value) => value.replace(/[^0-9a-fA-F]/g, '').slice(0, 6).toUpperCase();

  function hexToHsv(hex) {
    const value = hex.replace('#', '');
    const red = parseInt(value.slice(0, 2), 16) / 255;
    const green = parseInt(value.slice(2, 4), 16) / 255;
    const blue = parseInt(value.slice(4, 6), 16) / 255;
    const max = Math.max(red, green, blue);
    const min = Math.min(red, green, blue);
    const delta = max - min;
    let hue = 0;

    if (delta !== 0) {
      if (max === red) hue = ((green - blue) / delta) % 6;
      else if (max === green) hue = (blue - red) / delta + 2;
      else hue = (red - green) / delta + 4;
      hue /= 6;
      if (hue < 0) hue += 1;
    }

    return {
      hue,
      saturation: max === 0 ? 0 : delta / max,
      value: max,
    };
  }

  function hsvToHex(hue, saturation, value) {
    const normalizedHue = ((hue % 1) + 1) % 1;
    const chroma = value * saturation;
    const secondary = chroma * (1 - Math.abs(((normalizedHue * 6) % 2) - 1));
    const offset = value - chroma;
    const sector = normalizedHue * 6;
    let channels;

    if (sector < 1) channels = [chroma, secondary, 0];
    else if (sector < 2) channels = [secondary, chroma, 0];
    else if (sector < 3) channels = [0, chroma, secondary];
    else if (sector < 4) channels = [0, secondary, chroma];
    else if (sector < 5) channels = [secondary, 0, chroma];
    else channels = [chroma, 0, secondary];

    return `#${channels
      .map((channel) => Math.round((channel + offset) * 255).toString(16).padStart(2, '0'))
      .join('')}`.toUpperCase();
  }

  function renderPicker() {
    const hex = hsvToHex(pickerHue, pickerSaturation, pickerValue);
    colorPanel.style.setProperty('--thumb-color', hex);
    colorSv.style.setProperty('--picker-hue', `hsl(${pickerHue * 360}, 100%, 50%)`);
    colorSv.style.setProperty('--thumb-x', `${pickerSaturation * 100}%`);
    colorSv.style.setProperty('--thumb-y', `${(1 - pickerValue) * 100}%`);
    hueControl.style.setProperty('--hue-pos', `${pickerHue * 100}%`);
    hueInput.value = String(Math.min(359, Math.round(pickerHue * 360)));
    hexInput.value = hex.slice(1);
    return hex;
  }

  function applyPickerColor() {
    const hex = renderPicker();
    state.color = hex;
    customButton.style.setProperty('--custom-color', hex);
    customButton.style.setProperty('--custom-icon-color', contrastIconColor(hex));
    customButton.classList.add('is-on');
    customButton.setAttribute('aria-pressed', 'true');
  }

  function openColorPicker() {
    if (!overlay.hidden) return;

    const start = hexToHsv(state.color || customDefault);
    pickerHue = start.hue;
    pickerSaturation = start.saturation;
    pickerValue = start.value;
    renderPicker();

    overlay.hidden = false;
    controls.inert = true;
    customButton.setAttribute('aria-expanded', 'true');
    document.body.classList.add('color-picker-open');
    colorSv.focus({ preventScroll: true });
  }

  function closeColorPicker() {
    if (overlay.hidden) return;

    overlay.hidden = true;
    controls.inert = false;
    customButton.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('color-picker-open');
    customButton.focus({ preventScroll: true });
  }

  function updatePickerFromSv(event) {
    const rect = colorSv.getBoundingClientRect();
    pickerSaturation = clamp((event.clientX - rect.left) / rect.width);
    pickerValue = 1 - clamp((event.clientY - rect.top) / rect.height);
    applyPickerColor();
  }

  function toggleButton(button, key) {
    state[key] = !state[key];
    button.classList.toggle('is-on', state[key]);
    button.setAttribute('aria-pressed', String(state[key]));

    if (key === 'lang') {
      langGlyph.textContent = state.lang ? 'EN' : '文';
    }
  }

  function enterTree() {
    const params = new URLSearchParams();
    if (state.winter) params.set('season', 'winter');
    if (state.night) params.set('mode', 'night');
    if (state.forest) params.set('forest', 'true');
    if (state.color) params.set('color', state.color.slice(1));
    if (state.lang) params.set('lang', 'en');

    const query = params.toString();
    window.location.href = `${TREE_PAGE}${query ? `?${query}` : ''}`;
  }

  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      const action = button.dataset.action;

      if (action === 'enter') {
        enterTree();
        return;
      }

      if (action === 'custom') {
        openColorPicker();
        return;
      }

      toggleButton(button, action);
    });
  });

  colorSv.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    colorSv.setPointerCapture(event.pointerId);
    colorSv.focus({ preventScroll: true });
    updatePickerFromSv(event);
  });

  colorSv.addEventListener('pointermove', (event) => {
    if (!colorSv.hasPointerCapture(event.pointerId)) return;
    updatePickerFromSv(event);
  });

  colorSv.addEventListener('pointerup', (event) => {
    if (colorSv.hasPointerCapture(event.pointerId)) {
      colorSv.releasePointerCapture(event.pointerId);
    }
  });

  colorSv.addEventListener('pointercancel', (event) => {
    if (colorSv.hasPointerCapture(event.pointerId)) {
      colorSv.releasePointerCapture(event.pointerId);
    }
  });

  colorSv.addEventListener('keydown', (event) => {
    const step = event.shiftKey ? 0.08 : 0.02;
    let handled = true;

    if (event.key === 'ArrowLeft') pickerSaturation = clamp(pickerSaturation - step);
    else if (event.key === 'ArrowRight') pickerSaturation = clamp(pickerSaturation + step);
    else if (event.key === 'ArrowUp') pickerValue = clamp(pickerValue + step);
    else if (event.key === 'ArrowDown') pickerValue = clamp(pickerValue - step);
    else handled = false;

    if (!handled) return;
    event.preventDefault();
    applyPickerColor();
  });

  hueInput.addEventListener('input', () => {
    pickerHue = Number(hueInput.value) / 360;
    applyPickerColor();
  });

  hexInput.addEventListener('input', () => {
    const sanitized = sanitizeHex(hexInput.value);
    if (hexInput.value !== sanitized) hexInput.value = sanitized;
    if (sanitized.length !== 6) return;

    const parsed = hexToHsv(`#${sanitized}`);
    pickerHue = parsed.hue;
    pickerSaturation = parsed.saturation;
    pickerValue = parsed.value;
    applyPickerColor();
  });

  hexInput.addEventListener('blur', () => {
    const sanitized = sanitizeHex(hexInput.value);

    if (sanitized.length === 6) {
      hexInput.value = sanitized;
      return;
    }

    hexInput.value = hsvToHex(pickerHue, pickerSaturation, pickerValue).slice(1);
  });

  hexInput.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    hexInput.blur();
  });

  closeColorButton.addEventListener('click', closeColorPicker);

  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) closeColorPicker();
  });

  document.addEventListener('keydown', (event) => {
    if (overlay.hidden || event.key !== 'Escape') return;
    event.preventDefault();
    closeColorPicker();
  });
})();
</script>
</body>
</html>
