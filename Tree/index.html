<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Tree</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #a0a0a0;
    --line: 2px solid var(--ink);
    --panel-bg: #ffffff;
    --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    --panel-width: max-content;
    --panel-radius: 30px;
    --panel-pad: 14px 18px;
    --panel-offset: 20px;
    --row-radius: 14px;
    --row-gap: 16px;
    --row-pad: 10px 2px;
    --swatch-size: 40px;
    --name-size: 20px;
    --hex-size: 11px;
    --ring-offset: 3px;
    --hover-bg: #f6f7f4;
    --font-ui: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; cursor: grab; touch-action: none; }
  #app canvas:active { cursor: grabbing; }

  .palette {
    position: fixed;
    top: var(--panel-offset);
    left: var(--panel-offset);
    z-index: 10;
    display: flex;
    flex-direction: column;
    width: var(--panel-width);
    padding: var(--panel-pad);
    border: var(--line);
    border-radius: var(--panel-radius);
    background: var(--panel-bg);
    box-shadow: var(--panel-shadow);
    font-family: var(--font-ui);
    transform-origin: top left;
    touch-action: manipulation;
  }
  .palette-item {
    display: flex;
    align-items: center;
    gap: var(--row-gap);
    width: 100%;
    padding: var(--row-pad);
    border: 0;
    border-radius: var(--row-radius);
    background: transparent;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .palette-item:hover { background: var(--hover-bg); }
  .palette-item:focus-visible {
    outline: var(--line);
    outline-offset: 1px;
  }
  .swatch {
    width: var(--swatch-size);
    height: var(--swatch-size);
    flex: 0 0 auto;
    border: var(--line);
    border-radius: 50%;
    background: var(--swatch);
  }
  .palette-item.is-active .swatch {
    outline: var(--line);
    outline-offset: var(--ring-offset);
  }
  .palette-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .palette-name {
    font-size: var(--name-size);
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .palette-hex {
    font-family: var(--font-mono);
    font-size: var(--hex-size);
    line-height: 1.2;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    :root {
      --panel-offset: 16px;
      --panel-radius: 999px;
      --panel-pad: 16px;
      --swatch-size: 36px;
      --ring-offset: 1px;
    }
    .palette {
      top: auto;
      left: 50%;
      bottom: calc(var(--panel-offset) + env(safe-area-inset-bottom, 0px));
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: var(--row-gap);
      transform: translateX(-50%);
      transform-origin: bottom center;
      box-shadow: none;
    }
    .palette-item {
      width: auto;
      padding: 0;
      border-radius: 50%;
      background: transparent;
    }
    .palette-item:hover { background: transparent; }
    .palette-text { display: none; }
  }

  @media (max-width: 380px) {
    :root {
      --panel-offset: 12px;
      --panel-pad: 12px;
      --swatch-size: 32px;
      --row-gap: 12px;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<section class="palette" aria-label="颜色选择">
  <button type="button" class="palette-item" data-color="#ff9999" aria-label="樱花" title="樱花" aria-pressed="false">
    <span class="swatch" style="--swatch: #ff9999"></span>
    <span class="palette-text">
      <span class="palette-name">樱花</span>
      <span class="palette-hex">#FF9999</span>
    </span>
  </button>
  <button type="button" class="palette-item" data-color="#ff4444" aria-label="火焰木" title="火焰木" aria-pressed="false">
    <span class="swatch" style="--swatch: #ff4444"></span>
    <span class="palette-text">
      <span class="palette-name">火焰木</span>
      <span class="palette-hex">#FF4444</span>
    </span>
  </button>
  <button type="button" class="palette-item" data-color="#ff8822" aria-label="枫树" title="枫树" aria-pressed="false">
    <span class="swatch" style="--swatch: #ff8822"></span>
    <span class="palette-text">
      <span class="palette-name">枫树</span>
      <span class="palette-hex">#FF8822</span>
    </span>
  </button>
  <button type="button" class="palette-item" data-color="#ffcc00" aria-label="银桦" title="银桦" aria-pressed="false">
    <span class="swatch" style="--swatch: #ffcc00"></span>
    <span class="palette-text">
      <span class="palette-name">银桦</span>
      <span class="palette-hex">#FFCC00</span>
    </span>
  </button>
  <button type="button" class="palette-item is-active" data-color="#44aa22" aria-label="盛夏" title="盛夏" aria-pressed="true">
    <span class="swatch" style="--swatch: #44aa22"></span>
    <span class="palette-text">
      <span class="palette-name">盛夏</span>
      <span class="palette-hex">#44AA22</span>
    </span>
  </button>
  <button type="button" class="palette-item" data-color="#39c5bb" aria-label="初音未来" title="初音未来" aria-pressed="false">
    <span class="swatch" style="--swatch: #39c5bb"></span>
    <span class="palette-text">
      <span class="palette-name">初音未来</span>
      <span class="palette-hex">#39C5BB</span>
    </span>
  </button>
  <button type="button" class="palette-item" data-color="#cc88ff" aria-label="蓝花楹" title="蓝花楹" aria-pressed="false">
    <span class="swatch" style="--swatch: #cc88ff"></span>
    <span class="palette-text">
      <span class="palette-name">蓝花楹</span>
      <span class="palette-hex">#CC88FF</span>
    </span>
  </button>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   固定比例
   ============================================================ */
const TIERS = {
  top: { y: 2.77, radius: 1.39 },
  shoulder: { y: 2.21, radius: 0.86, spread: 1.24, count: 7 },
  bottom: { y: 1.77, radius: 0.58, spread: 1.29, count: 12 },
};

const TRUNK = {
  height: 2.0,
  topRadius: 0.24,
  bottomRadius: 0.34,
};

const SEED = 20261028;
const TWO_PI = Math.PI * 2;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 120);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (error) {
  document.querySelector('.palette')?.remove();
  app.innerHTML = '<p style="font:14px/1.6 sans-serif;color:#555;padding:24px">当前浏览器无法启用 WebGL，请更换浏览器后重试。</p>';
  throw error;
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = Math.PI / 2;
const MIN_CAMERA_HEIGHT = 0.25;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.85;

/* ============================================================
   动漫风材质
   ============================================================ */
function createToonGradient() {
  const data = new Uint8Array([
    135, 135, 135, 255,
    205, 205, 205, 255,
    255, 255, 255, 255,
  ]);
  const texture = new THREE.DataTexture(data, 3, 1, THREE.RGBAFormat);
  texture.minFilter = THREE.NearestFilter;
  texture.magFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  texture.needsUpdate = true;
  return texture;
}

const gradientMap = createToonGradient();

const foliageMaterial = new THREE.MeshToonMaterial({
  color: '#44aa22',
  gradientMap,
});

const trunkMaterial = new THREE.MeshToonMaterial({
  color: 0x9b6a3f,
  gradientMap,
});

const foliageOutlineMaterial = new THREE.MeshBasicMaterial({
  color: 0x1b3d0c,
  side: THREE.BackSide,
});

const trunkOutlineMaterial = new THREE.MeshBasicMaterial({
  color: 0x35210f,
  side: THREE.BackSide,
});

/* ============================================================
   灯光 / 阴影地面
   ============================================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.62));

const sun = new THREE.DirectionalLight(0xfff6e8, 2.5);
sun.position.set(5, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
sun.shadow.camera.updateProjectionMatrix();
sun.target.position.set(0, 1.8, 0);
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-6, 4, -5);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.ShadowMaterial({ color: 0x34412d, opacity: 0.1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   描边辅助
   ============================================================ */
function createOutlineGeometry(source, thickness) {
  const geometry = source.clone();
  const position = geometry.attributes.position;
  const normal = geometry.attributes.normal;
  const n = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    n.fromBufferAttribute(normal, i);
    position.setXYZ(
      i,
      position.getX(i) + n.x * thickness,
      position.getY(i) + n.y * thickness,
      position.getZ(i) + n.z * thickness
    );
  }

  position.needsUpdate = true;
  geometry.computeBoundingSphere();
  return geometry;
}

/* ============================================================
   树干：上窄下宽，居中，无树根
   ============================================================ */
const trunkGeometry = new THREE.CylinderGeometry(
  TRUNK.topRadius,
  TRUNK.bottomRadius,
  TRUNK.height,
  12,
  1,
  false
);
trunkGeometry.translate(0, TRUNK.height / 2, 0);

const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
trunk.castShadow = true;
trunk.receiveShadow = true;
scene.add(trunk);

scene.add(new THREE.Mesh(
  createOutlineGeometry(trunkGeometry, 0.018),
  trunkOutlineMaterial
));

/* ============================================================
   树冠：1 顶圆 + 7 肩圆 + 12 底圆
   ============================================================ */
function createCanopyBlobs() {
  const rnd = mulberry32(SEED);
  const rr = (min, max) => min + (max - min) * rnd();
  const blobs = [{
    x: rr(-0.03, 0.03),
    y: TIERS.top.y + rr(-0.03, 0.03),
    z: rr(-0.03, 0.03),
    r: TIERS.top.radius * rr(0.98, 1.03),
  }];

  const shoulderStart = rnd() * TWO_PI;
  for (let i = 0; i < TIERS.shoulder.count; i++) {
    const angle = shoulderStart + (i / TIERS.shoulder.count) * TWO_PI + rr(-0.09, 0.09);
    const ring = TIERS.shoulder.spread * rr(0.94, 1.06);
    blobs.push({
      x: Math.cos(angle) * ring,
      y: TIERS.shoulder.y + rr(-0.07, 0.07),
      z: Math.sin(angle) * ring,
      r: TIERS.shoulder.radius * rr(0.9, 1.1),
    });
  }

  const bottomStart = shoulderStart + rr(0.1, 0.3);
  for (let i = 0; i < TIERS.bottom.count; i++) {
    const angle = bottomStart + (i / TIERS.bottom.count) * TWO_PI + rr(-0.07, 0.07);
    const ring = TIERS.bottom.spread * rr(0.95, 1.05);
    blobs.push({
      x: Math.cos(angle) * ring,
      y: TIERS.bottom.y + rr(-0.07, 0.07),
      z: Math.sin(angle) * ring,
      r: TIERS.bottom.radius * rr(0.9, 1.1),
    });
  }

  return blobs;
}

const canopyGeometries = createCanopyBlobs().map((blob) => {
  const geometry = new THREE.SphereGeometry(blob.r, 24, 16);
  geometry.translate(blob.x, blob.y, blob.z);
  return geometry;
});
const canopyGeometry = mergeGeometries(canopyGeometries, false);
canopyGeometries.forEach((geometry) => geometry.dispose());

const canopy = new THREE.Mesh(canopyGeometry, foliageMaterial);
canopy.castShadow = true;
scene.add(canopy);

scene.add(new THREE.Mesh(
  createOutlineGeometry(canopyGeometry, 0.023),
  foliageOutlineMaterial
));

canopyGeometry.computeBoundingBox();
const canopyBox = canopyGeometry.boundingBox;
const canopyRadius = Math.max(
  canopyBox.max.x - canopyBox.min.x,
  canopyBox.max.z - canopyBox.min.z
) * 0.5;

/* ============================================================
   落叶：集中在树下
   ============================================================ */
function buildFallenLeaves(radius) {
  const rnd = mulberry32(SEED + 71);
  const spots = [];
  const count = 170;

  for (let i = 0; i < count; i++) {
    const angle = rnd() * TWO_PI;
    let distance = 0.55 + Math.pow(rnd(), 1.35) * radius * 0.88;
    if (rnd() < 0.09) distance += 0.35 + rnd() * 0.45;
    spots.push({
      x: Math.cos(angle) * distance,
      z: Math.sin(angle) * distance,
    });
  }

  const geometry = new THREE.CylinderGeometry(0.13, 0.13, 0.022, 10);
  const mesh = new THREE.InstancedMesh(geometry, foliageMaterial, spots.length);
  const dummy = new THREE.Object3D();

  spots.forEach((spot, index) => {
    const size = 0.62 + rnd() * 0.38;
    dummy.position.set(spot.x, 0.012 + rnd() * 0.008, spot.z);
    dummy.rotation.set(
      (rnd() - 0.5) * 0.14,
      rnd() * TWO_PI,
      (rnd() - 0.5) * 0.14
    );
    dummy.scale.set(size, 1, size * (1.35 + rnd() * 0.55));
    dummy.updateMatrix();
    mesh.setMatrixAt(index, dummy.matrix);
  });

  mesh.instanceMatrix.needsUpdate = true;
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  scene.add(mesh);
}

buildFallenLeaves(canopyRadius);

/* ============================================================
   颜色面板
   ============================================================ */
const paletteItems = Array.from(document.querySelectorAll('.palette-item'));

function applyFoliageColor(color) {
  foliageMaterial.color.set(color);
  foliageOutlineMaterial.color
    .set(color)
    .multiplyScalar(0.16);
}

paletteItems.forEach((item) => {
  item.addEventListener('click', () => {
    paletteItems.forEach((other) => {
      const active = other === item;
      other.classList.toggle('is-active', active);
      other.setAttribute('aria-pressed', String(active));
    });
    applyFoliageColor(item.dataset.color);
  });
});

const initialPaletteItem = document.querySelector('.palette-item.is-active');
applyFoliageColor(initialPaletteItem.dataset.color);

/* ============================================================
   自动取景 / 交互 / 渲染
   ============================================================ */
function updateCameraLimit() {
  const distance = camera.position.distanceTo(controls.target);
  if (distance <= 0) return;
  const ratio = (MIN_CAMERA_HEIGHT - controls.target.y) / distance;
  controls.maxPolarAngle = Math.acos(THREE.MathUtils.clamp(ratio, -1, 1));
}

function frameTree() {
  const bounds = new THREE.Box3();
  bounds.expandByObject(trunk);
  bounds.expandByObject(canopy);

  const center = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());

  const verticalFov = THREE.MathUtils.degToRad(camera.fov);
  const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
  const distanceForHeight = size.y / 2 / Math.tan(verticalFov / 2);
  const distanceForWidth =
    Math.max(size.x, size.z) / 2 / Math.tan(horizontalFov / 2);
  const compact = window.matchMedia('(max-width: 560px)').matches;
  const distance = Math.max(distanceForHeight, distanceForWidth) * (compact ? 1.28 : 1.74);

  const viewDirection = new THREE.Vector3(0.5, 0.2, 0.82).normalize();
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(viewDirection, distance);
  controls.maxDistance = Math.max(24, distance * 2.2);
  controls.update();
}

let hasInteracted = false;

const AUTO_ROTATE_DELAY = 10000;
const AUTO_ROTATE_SPEED = 0.8;
let autoRotateTimer = null;
let lastDragDirection = 1;
let dragStartX = null;

function stopAutoRotate() {
  controls.autoRotate = false;
  if (autoRotateTimer !== null) {
    window.clearTimeout(autoRotateTimer);
    autoRotateTimer = null;
  }
}

function scheduleAutoRotate() {
  stopAutoRotate();
  autoRotateTimer = window.setTimeout(() => {
    controls.autoRotateSpeed = AUTO_ROTATE_SPEED * lastDragDirection;
    controls.autoRotate = true;
    autoRotateTimer = null;
  }, AUTO_ROTATE_DELAY);
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  dragStartX = event.clientX;
  stopAutoRotate();
});

window.addEventListener('pointerup', (event) => {
  if (dragStartX === null) return;
  const travel = event.clientX - dragStartX;
  if (Math.abs(travel) >= 8) {
    lastDragDirection = travel > 0 ? 1 : -1;
  }
  dragStartX = null;
});

window.addEventListener('pointercancel', () => {
  dragStartX = null;
});

controls.addEventListener('start', () => {
  hasInteracted = true;
  stopAutoRotate();
});

controls.addEventListener('end', scheduleAutoRotate);

function fitPalette() {
  const palette = document.querySelector('.palette');
  if (!palette) return;

  palette.style.transform = '';
  const style = getComputedStyle(palette);
  const offset = parseFloat(style.getPropertyValue('--panel-offset')) || 16;

  if (window.matchMedia('(max-width: 560px)').matches) {
    const naturalWidth = palette.offsetWidth;
    const available = Math.max(window.innerWidth - offset * 2, 1);
    const scale = Math.min(1, available / naturalWidth);
    palette.style.transform = scale < 1
      ? `translateX(-50%) scale(${scale})`
      : 'translateX(-50%)';
    return;
  }

  const naturalHeight = palette.offsetHeight;
  const available = Math.max(window.innerHeight - offset * 2, 1);

  if (naturalHeight > available) {
    palette.style.transform = `scale(${available / naturalHeight})`;
  }
}

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitPalette();
  if (!hasInteracted) frameTree();
}

window.addEventListener('resize', resize);
frameTree();
fitPalette();
scheduleAutoRotate();
renderer.shadowMap.needsUpdate = true;

let lastFrameTime = 0;

renderer.setAnimationLoop((time) => {
  const deltaTime = lastFrameTime === 0
    ? 0
    : Math.min((time - lastFrameTime) / 1000, 0.1);
  lastFrameTime = time;

  updateCameraLimit();
  controls.update(deltaTime);

  if (camera.position.y < MIN_CAMERA_HEIGHT) {
    camera.position.y = MIN_CAMERA_HEIGHT;
    camera.lookAt(controls.target);
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
