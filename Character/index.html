<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>MAMI · VRM 动作演示</title>
<style>
  :root {
    --accent: #e8b45a;
    --line: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0d13;
    color: #eef1f6;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }

  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
  }

  #hud {
    position: fixed;
    left: 28px;
    top: 24px;
    pointer-events: none;
  }

  #hud h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }

  #hud h1 span { color: var(--accent); }

  #hud p {
    margin: 6px 0 0;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(238, 241, 246, 0.55);
  }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(10, 13, 19, 0.5);
    backdrop-filter: blur(8px);
    color: rgba(238, 241, 246, 0.55);
    font-size: 12px;
    letter-spacing: 0.06em;
    white-space: nowrap;
    pointer-events: none;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0a0d13;
    transition: opacity 0.6s ease;
  }

  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 42px;
    height: 42px;
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-text {
    font-size: 13px;
    letter-spacing: 0.1em;
    color: rgba(238, 241, 246, 0.65);
  }

  #error {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: rgba(8, 10, 15, 0.92);
  }

  #error.show { display: flex; }

  #error .box {
    max-width: 620px;
    padding: 26px 30px;
    border: 1px solid rgba(255, 120, 120, 0.35);
    border-radius: 14px;

  }

  #error h2 {
    margin: 0 0 10px;

  }

    margin: 8px 0;

  .lil-gui {
    --background-color: rgba(16, 20, 28, 0.82);
    --widget-color: rgba(255, 255, 255, 0.08);
    --hover-color: rgba(255, 255, 255, 0.14);
    --focus-color: rgba(255, 255, 255, 0.2);
    --number-color: #e8b45a;
    --string-color: #9bd1ff;

<body>
  <div id="app"></div>
  <div class="vignette"></div>

  <div id="hud">
    <h1><span>MAMI</span> · VRM 动作演示</h1>
    <p>three.js r170 · @pixiv/three-vrm 3.5.5</p>
  </div>

  <div id="hint">拖拽旋转 · 滚轮缩放 · 数字键 1-3 切换动作</div>

  <button id="panel-toggle" type="button">动作面板</button>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">正在加载 character.vrm…</div>
  </div>

  <div id="error">
    <div class="box">
      <h2>加载失败</h2>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const TAU = Math.PI * 2;
const SIN = (p, freq = 1, phase = 0) => Math.sin(TAU * freq * p + phase);

const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');

function showError(message, code = '') {
  document.getElementById('error-msg').textContent = message;
  const codeEl = document.getElementById('error-code');
  codeEl.textContent = code;
  codeEl.style.display = code ? 'block' : 'none';
  document.getElementById('error').classList.add('show');
  loadingEl.classList.add('hidden');
}

function setLoadingText(text) {
  loadingText.textContent = text;
}

/* ------------------------------------------------------------------ *
 * 基础动作：来自 VRMA 文件，切换时交叉淡入淡出
 * ------------------------------------------------------------------ */
const motionDefs = [
  { key: 'waiting',   label: '待机', file: './motions/waiting.vrma',   loop: 'repeat' },
  { key: 'appearing', label: '登场', file: './motions/appearing.vrma', loop: 'once' },
  { key: 'liked',     label: '喜欢', file: './motions/liked.vrma',     loop: 'repeat' },
];

/* ------------------------------------------------------------------ *
 * 动作库：来自 tk256ailab/vrm-viewer 的 MIT 示例 VRMA
 * 这些动作首尾姿势不同，因此按一次性动作播放，结束后回到待机
 * ------------------------------------------------------------------ */
const libraryDefs = [
  { key: 'clapping',   label: '鼓掌', file: './motions/library/clapping.vrma' },
  { key: 'goodbye',    label: '再见', file: './motions/library/goodbye.vrma' },
  { key: 'angry',      label: '生气', file: './motions/library/angry.vrma' },
  { key: 'blush',      label: '害羞', file: './motions/library/blush.vrma' },
  { key: 'jump',       label: '跳跃', file: './motions/library/jump.vrma' },
  { key: 'lookaround', label: '张望', file: './motions/library/lookaround.vrma' },
  { key: 'relax',      label: '放松', file: './motions/library/relax.vrma' },
  { key: 'sad',        label: '失落', file: './motions/library/sad.vrma' },
  { key: 'sleepy',     label: '犯困', file: './motions/library/sleepy.vrma' },
  { key: 'surprised',  label: '惊讶', file: './motions/library/surprised.vrma' },
  { key: 'thinking',   label: '思考', file: './motions/library/thinking.vrma' },
];

/* ------------------------------------------------------------------ *
 * 表情：MAMI 实际可用的 VRM 预设
 * joy/sorrow/fun 会被 three-vrm 映射为 happy/sad/relaxed；
 * blinkLeft/blinkRight 在这个模型里没有绑定，所以不放入面板。
 * ------------------------------------------------------------------ */
const expressionDefs = [
  { key: 'happy',   label: '高兴' },
  { key: 'angry',   label: '生气' },
  { key: 'sad',     label: '悲伤' },
  { key: 'relaxed', label: '放松' },
  { key: 'aa',      label: '张嘴' },
  { key: 'blink',   label: '眨眼' },
];

/* ------------------------------------------------------------------ *
 * 叠加动作：程序化生成的四元数增量轨道，权重 0-1 可调
 * 坐标约定：归一化骨骼的局部轴在静止姿态下与世界轴同向
 * ------------------------------------------------------------------ */
const additiveDefs = [
  {
    key: 'breathe',
    label: '呼吸',
    duration: 4.0,
    weight: 0,
    bones: {
      spine: { rotation: (p) => ({ x: 0.010 * SIN(p) }) },
      chest: { rotation: (p) => ({ x: 0.018 * SIN(p), z: 0.004 * SIN(p, 1, Math.PI / 2) }) },
      neck:  { rotation: (p) => ({ x: -0.006 * SIN(p) }) },
      head:  { rotation: (p) => ({ x: -0.008 * SIN(p), z: 0.004 * SIN(p, 1, 0.5) }) },
      hips:  { position: (p) => ({ y: 0.006 * SIN(p) }) },
    },
  },
  {
    key: 'wave',
    label: '挥手',
    duration: 2.4,
    weight: 0,
    bones: {
      rightUpperArm: { rotation: (p) => ({ z: 1.15 + 0.04 * SIN(p, 2) }) },
      rightLowerArm: { rotation: (p) => ({ z: 1.00 + 0.24 * SIN(p, 4) }) },
      rightHand:     { rotation: (p) => ({ x: 0.10, z: 0.30 * SIN(p, 4, 0.5) }) },
    },
  },
  {
    key: 'nod',
    label: '点头',
    duration: 1.6,
    weight: 0,
    bones: {
      neck: { rotation: (p) => ({ x: -0.075 * (0.5 - 0.5 * Math.cos(TAU * 2 * p)) }) },
      head: { rotation: (p) => ({ x: -0.180 * (0.5 - 0.5 * Math.cos(TAU * 2 * p)) }) },
    },
  },
  {
    key: 'shake',
    label: '摇头',
    duration: 1.8,
    weight: 0,
    bones: {
      neck: { rotation: (p) => ({ y: 0.090 * SIN(p, 2) }) },
      head: { rotation: (p) => ({ y: 0.300 * SIN(p, 2) }) },
    },
  },
  {
    key: 'sway',
    label: '摆身',
    duration: 3.2,
    weight: 0,
    bones: {
      hips:  { rotation: (p) => ({ z: 0.045 * SIN(p) }), position: (p) => ({ x: 0.020 * SIN(p) }) },
      spine: { rotation: (p) => ({ z: -0.028 * SIN(p) }) },
      chest: { rotation: (p) => ({ z: -0.018 * SIN(p) }) },
      head:  { rotation: (p) => ({ z: 0.018 * SIN(p), y: 0.020 * SIN(p, 1, 1.0) }) },
    },
  },
];

let vrm = null;
let mixer = null;
let currentBase = null;
let currentGesture = null;
let characterHeight = 1.5;
let guiInstance = null;
let gestureController = null;

const baseActions = {};
const additiveActions = {};
const gestureActions = {};
const baseControllers = {};
const expressionControllers = {};
const expressionOverrides = new Map();
const gestureSelection = { key: 'none' };
const clock = new THREE.Clock();

/* ------------------------------------------------------------------ *
 * 场景
 * ------------------------------------------------------------------ */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 8, 24);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(0, 1.02, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.86, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 1.7;
controls.maxDistance = 7;
controls.minPolarAngle = Math.PI * 0.16;
controls.maxPolarAngle = Math.PI * 0.53;
controls.update();

const hemiLight = new THREE.HemisphereLight(0xdfe8ff, 0x2a2118, 1.7);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xfff2dd, 2.4);
keyLight.position.set(2.4, 3.6, 2.8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 12;
keyLight.shadow.camera.left = -3;
keyLight.shadow.camera.right = 3;
keyLight.shadow.camera.top = 3.5;
keyLight.shadow.camera.bottom = -1.5;
keyLight.shadow.bias = -0.0008;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9fc4ff, 1.3);
rimLight.position.set(-2.5, 2.2, -3.0);
scene.add(rimLight);

function createGroundTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 8, size / 2, size / 2, size / 2);
  grad.addColorStop(0, '#2b3444');
  grad.addColorStop(0.55, '#1a202b');
  grad.addColorStop(1, '#0b0e14');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 128),
  new THREE.MeshStandardMaterial({ map: createGroundTexture(), roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 * 动作工具
 * ------------------------------------------------------------------ */

/**
 * 生成指定长度的加法动画片段。
 * 每根骨骼的 rotation 返回局部欧拉角，position 返回局部位移增量。
 * 以单位四元数/零位移作为参考帧，使 makeClipAdditive 得到纯增量轨道。
 */
function buildAdditiveClip(name, duration, bones) {
  const steps = 48;
  const times = [];
  for (let i = 0; i <= steps; i++) times.push((duration * i) / steps);

  const tracks = [];
  const refTracks = [];
  const euler = new THREE.Euler();
  const quat = new THREE.Quaternion();

  for (const [boneName, spec] of Object.entries(bones)) {
    const node = vrm.humanoid.getNormalizedBoneNode(boneName);
    if (!node) {
      console.warn(`[additive] 缺少骨骼: ${boneName}`);
      continue;
    }

    const rotValues = [];
    for (let i = 0; i <= steps; i++) {
      const p = i / steps;
      const r = spec.rotation ? spec.rotation(p) : null;
      euler.set(r?.x || 0, r?.y || 0, r?.z || 0, 'XYZ');
      quat.setFromEuler(euler);
      rotValues.push(quat.x, quat.y, quat.z, quat.w);
    }

    const rotTrackName = `${node.name}.quaternion`;
    tracks.push(new THREE.QuaternionKeyframeTrack(rotTrackName, times.slice(), rotValues));
    refTracks.push(new THREE.QuaternionKeyframeTrack(rotTrackName, [0], [0, 0, 0, 1]));

    if (spec.position) {
      const posValues = [];
      for (let i = 0; i <= steps; i++) {
        const v = spec.position(i / steps);
        posValues.push(v?.x || 0, v?.y || 0, v?.z || 0);
      }
      const posTrackName = `${node.name}.position`;
      tracks.push(new THREE.VectorKeyframeTrack(posTrackName, times.slice(), posValues));
      refTracks.push(new THREE.VectorKeyframeTrack(posTrackName, [0], [0, 0, 0]));
    }
  }

  const clip = new THREE.AnimationClip(name, duration, tracks);
  const refClip = new THREE.AnimationClip(`${name}__ref`, duration, refTracks);
  THREE.AnimationUtils.makeClipAdditive(clip, 0, refClip);
  return clip;
}

function fadeToAction(action, previousAction, fadeDuration) {
  action.enabled = true;
  action.reset();
  action.setEffectiveTimeScale(1);
  action.setEffectiveWeight(1);
  action.play();

  if (previousAction && previousAction !== action) {
    action.crossFadeFrom(previousAction, fadeDuration, false);
  }
}

function updateBaseButtons(key) {
  for (const [k, controller] of Object.entries(baseControllers)) {
    controller.domElement.classList.toggle('base-active', k === key);
  }
}

function setGestureSelection(key) {
  if (gestureController) {
    gestureController.setValue(key);
  } else {
    gestureSelection.key = key;
  }
}

function setBase(key, fadeDuration = 0.35) {
  const next = baseActions[key];
  if (!next) return;
  if (next === currentBase && !currentGesture) return;

  const hadGesture = !!currentGesture;
  const previous = currentGesture?.action || currentBase?.action || null;
  fadeToAction(next.action, previous, fadeDuration);

  currentBase = next;
  currentGesture = null;
  updateBaseButtons(key);
  if (hadGesture) setGestureSelection('none');
}

function playGesture(key, fadeDuration = 0.35) {
  const next = gestureActions[key];
  if (!next || next === currentGesture) return;

  const previous = currentGesture?.action || currentBase?.action || null;
  fadeToAction(next.action, previous, fadeDuration);

  currentGesture = next;
  updateBaseButtons(null);
}

function returnToWaiting(fadeDuration = 0.6) {
  const waiting = baseActions.waiting;
  if (!waiting) return;

  const previous = currentGesture?.action || currentBase?.action || null;
  fadeToAction(waiting.action, previous, fadeDuration);

  currentBase = waiting;
  currentGesture = null;
  updateBaseButtons('waiting');
  setGestureSelection('none');
}

function setAdditiveWeight(key, weight) {
  const entry = additiveActions[key];
  if (!entry) return;
  entry.weight = weight;
  entry.action.setEffectiveWeight(weight);
}

function setExpressionWeight(key, weight) {
  expressionOverrides.set(key, weight);
  if (weight <= 0 && vrm?.expressionManager) {
    vrm.expressionManager.setValue(key, 0);
  }
}

// 在 mixer.update() 之后、vrm.update() 之前调用，
// 让手动表情覆盖 VRMA 动作自带的 aa/blink/relaxed 轨道。
function applyExpressionOverrides() {
  if (!vrm?.expressionManager) return;
  for (const [key, weight] of expressionOverrides) {
    if (weight > 0) {
      vrm.expressionManager.setValue(key, weight);
    }
  }
}

function resetCamera() {
  if (!vrm) return;
  controls.target.set(0, characterHeight * 0.55, 0);
  camera.position.set(0, characterHeight * 0.64, Math.max(2.9, characterHeight * 2.2));
  controls.update();
}

function buildGUI() {
  const gui = new GUI({ title: '动作面板' });
  guiInstance = gui;

  const baseFolder = gui.addFolder('基础动作');
  for (const def of motionDefs) {
    const api = { [def.label]: () => setBase(def.key) };
    const controller = baseFolder.add(api, def.label);
    baseControllers[def.key] = controller;
  }
  baseFolder.open();

  const libraryFolder = gui.addFolder('动作库（示例）');
  const gestureOptions = { '-': 'none' };
  for (const def of libraryDefs) {
    if (gestureActions[def.key]) gestureOptions[def.label] = def.key;
  }
  gestureController = libraryFolder
    .add(gestureSelection, 'key', gestureOptions)
    .name('选择动作')
    .onChange((key) => {
      if (key === 'none') {
        if (currentGesture) returnToWaiting(0.35);
      } else {
        playGesture(key);
      }
    });
  libraryFolder.open();

  const additiveFolder = gui.addFolder('叠加动作（权重）');
  for (const def of additiveDefs) {
    additiveFolder
      .add(def, 'weight', 0, 1, 0.01)
      .name(def.label)
      .onChange((value) => setAdditiveWeight(def.key, value));
  }
  additiveFolder.open();

  const expressionFolder = gui.addFolder('表情');
  for (const def of expressionDefs) {
    const state = { weight: 0 };
    expressionControllers[def.key] = expressionFolder
      .add(state, 'weight', 0, 1, 0.01)
      .name(def.label)
      .onChange((value) => setExpressionWeight(def.key, value));
  }
  expressionFolder.add({
    reset: () => {
      for (const controller of Object.values(expressionControllers)) {
        controller.setValue(0);
      }
    },
  }, 'reset').name('重置表情');
  expressionFolder.open();

  const generalFolder = gui.addFolder('播放控制');
  generalFolder.add({ speed: 1 }, 'speed', 0, 1.5, 0.01)
    .name('速度')
    .onChange((value) => { if (mixer) mixer.timeScale = value; });
  generalFolder.add({ reset: resetCamera }, 'reset').name('重置视角');
  generalFolder.open();
}

/* ------------------------------------------------------------------ *
 * 主流程
 * ------------------------------------------------------------------ */
async function main() {
  if (location.protocol === 'file:') {
    showError(
      '浏览器禁止通过 file:// 读取本地模型和动作文件。请用本地 HTTP 服务器打开本页面。',
      'cd D:\\Projects\\Agent\\three_js\npython -m http.server 8000\n\n# 然后访问 http://localhost:8000/'
    );
    return;
  }

  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));
  loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

  setLoadingText('正在加载 character.vrm…');

  let gltf;
  try {
    gltf = await loader.loadAsync('./character.vrm', (event) => {
      if (event.total) {
        const pct = Math.round((event.loaded / event.total) * 100);
        setLoadingText(`正在加载 character.vrm… ${pct}%`);
      }
    });
  } catch (error) {
    showError(
      '无法加载 character.vrm。请确认文件与 index.html 在同一目录，并通过 HTTP 服务器访问。',
      String(error?.message || error)
    );
    return;
  }

  vrm = gltf.userData.vrm;
  if (!vrm) {
    showError('character.vrm 中没有找到 VRM 数据，请确认文件格式。');
    return;
  }

  // VRM 0.x 模型默认背对 three.js 相机，旋转 180 度使其面向观众
  VRMUtils.rotateVRM0(vrm);

  vrm.scene.traverse((object) => {
    if (object.isMesh) {
      object.castShadow = true;
      object.frustumCulled = false;
    }
  });

  scene.add(vrm.scene);
  vrm.scene.updateMatrixWorld(true);

  const initialBox = new THREE.Box3().setFromObject(vrm.scene);
  const initialSize = new THREE.Vector3();
  initialBox.getSize(initialSize);
  characterHeight = Math.max(initialSize.y, 1.2);

  resetCamera();

  mixer = new THREE.AnimationMixer(vrm.scene);

  // 基础动作
  setLoadingText('正在加载基础动作…');
  for (let i = 0; i < motionDefs.length; i++) {
    const def = motionDefs[i];
    setLoadingText(`正在加载基础动作（${i + 1}/${motionDefs.length}）… ${def.label}`);

    let animGltf;
    try {
      animGltf = await loader.loadAsync(def.file);
    } catch (error) {
      showError(`无法加载动作文件 ${def.file}。`, String(error?.message || error));
      return;
    }

    const vrmAnimation = animGltf.userData.vrmAnimations?.[0];
    if (!vrmAnimation) {
      showError(`动作文件 ${def.file} 中没有 VRM 动画数据。`);
      return;
    }

    const clip = createVRMAnimationClip(vrmAnimation, vrm);
    clip.name = def.key;

    const action = mixer.clipAction(clip);
    if (def.loop === 'once') {
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
    } else {
      action.setLoop(THREE.LoopRepeat, Infinity);
    }
    action.setEffectiveWeight(0);
    action.play();

    baseActions[def.key] = { ...def, action };
  }

  // 动作库（一次性动作，加载失败时跳过，不影响页面）
  for (let i = 0; i < libraryDefs.length; i++) {
    const def = libraryDefs[i];
    setLoadingText(`正在加载动作库（${i + 1}/${libraryDefs.length}）… ${def.label}`);

    try {
      const animGltf = await loader.loadAsync(def.file);
      const vrmAnimation = animGltf.userData.vrmAnimations?.[0];
      if (!vrmAnimation) throw new Error('没有 VRM 动画数据');

      const clip = createVRMAnimationClip(vrmAnimation, vrm);
      clip.name = def.key;

      const action = mixer.clipAction(clip);
      action.setLoop(THREE.LoopOnce, 1);
      action.clampWhenFinished = true;
      action.setEffectiveWeight(0);
      action.play();

      gestureActions[def.key] = { ...def, action };
    } catch (error) {
      console.warn(`[library] 跳过无法加载的动作 ${def.file}`, error);
    }
  }

  // 叠加动作
  for (const def of additiveDefs) {
    const clip = buildAdditiveClip(def.key, def.duration, def.bones);
    const action = mixer.clipAction(clip);
    action.setLoop(THREE.LoopRepeat, Infinity);
    action.setEffectiveWeight(0);
    action.play();
    additiveActions[def.key] = { ...def, action };
  }

  // 一次性动作播完后自动回到待机
  mixer.addEventListener('finished', (event) => {
    if (currentGesture) {
      if (event.action === currentGesture.action) returnToWaiting(0.6);
      return;
    }
    if (currentBase && event.action === currentBase.action && currentBase.loop === 'once') {
      returnToWaiting(0.6);
    }
  });

  // 默认播放待机
  currentBase = baseActions.waiting;
  currentBase.action.setEffectiveWeight(1);

  buildGUI();
  for (const [key, controller] of Object.entries(baseControllers)) {
    controller.domElement.classList.toggle('base-active', key === 'waiting');
  }

  // 窄屏下用按钮收起/展开面板
  const panelToggle = document.getElementById('panel-toggle');
  panelToggle.addEventListener('click', () => {
    const open = document.body.classList.toggle('panel-open');
    panelToggle.textContent = open ? '收起面板' : '动作面板';
  });

  // 键盘快捷键
  window.addEventListener('keydown', (event) => {
    if (event.key === '1') setBase('waiting');
    else if (event.key === '2') setBase('appearing');
    else if (event.key === '3') setBase('liked');
    else if (event.key === '0') resetCamera();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  renderer.setAnimationLoop(() => {
    const delta = Math.min(clock.getDelta(), 0.05);
    mixer.update(delta);
    applyExpressionOverrides();
    vrm.update(delta);
    controls.update();
    renderer.render(scene, camera);
  });

  // 调试用，方便在控制台切换动作
  window.__mami = {
    THREE, vrm, mixer, baseActions, additiveActions, gestureActions, additiveDefs, expressionDefs,
    setBase, setAdditiveWeight, setExpressionWeight, playGesture, resetCamera,
    gui: guiInstance, scene, camera, renderer,
  };

  setLoadingText('准备就绪');
  loadingEl.classList.add('hidden');
  setTimeout(() => { loadingEl.style.display = 'none'; }, 700);
}

main().catch((error) => {
  console.error(error);
  showError('初始化失败，请查看浏览器控制台获取详细信息。', String(error?.message || error));
});
</script>
</body>
</html>
