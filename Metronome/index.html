<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>节拍器 · Metronome</title>
<style>
  :root {
    --bg: #090b0f;
    --panel: rgba(19, 23, 30, 0.82);
    --border: rgba(255, 255, 255, 0.07);
    --text: #e9edf4;
    --muted: #8b95a7;
    --dim: #5c6576;
    --accent: #ffb454;
    --accent-strong: #ffc66d;
    --accent-soft: rgba(255, 180, 84, 0.14);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 750px at 50% -12%, rgba(255, 180, 84, 0.10), transparent 62%),
      radial-gradient(850px 650px at 92% 112%, rgba(90, 140, 255, 0.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid rgba(255, 180, 84, 0.65);
    outline-offset: 2px;
  }

  .app {
    width: 100%;
    max-width: 440px;
    padding: 26px 24px 22px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 28%),
      var(--panel);
    box-shadow:
      0 34px 90px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }

  /* ---------- header ---------- */

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .logo {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(160deg, #ffd08a, #f3a43b);
    color: #1a1206;
    font-size: 21px;
    line-height: 1;
    font-weight: 700;
    box-shadow: 0 8px 22px rgba(243, 164, 59, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    user-select: none;
  }

  .brand h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.02em;
  }

  .brand p {
    margin: 3px 0 0;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.26em;
    color: var(--dim);
  }

  kbd {
    padding: 5px 8px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-bottom-color: rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.035);
    color: var(--dim);
    font-family: inherit;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }

  /* ---------- dial ---------- */

  .dial {
    --size: min(300px, 76vw);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin: 2px auto 24px;
    border-radius: 50%;
  }

  .dial::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.055);
    box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }

  .ticks {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from -90.4deg,
      rgba(255, 255, 255, 0.17) 0deg 0.6deg,
      transparent 0.6deg 6deg
    );
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 9px));
    opacity: 0.75;
    transition: opacity 0.3s ease;
  }

  .dial.running .ticks { opacity: 1; }

  .beat-ring { position: absolute; inset: 0; }

  .beat-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: max(7px, calc(var(--size) * 0.034));
    height: max(7px, calc(var(--size) * 0.034));
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    transform: translate(-50%, -50%) rotate(var(--angle, -90deg)) translateY(calc(var(--size) * -0.425));
    transition: background 0.09s ease, box-shadow 0.12s ease;
  }

  .beat-dot.accent {
    background: rgba(255, 180, 84, 0.30);
    box-shadow: inset 0 0 0 1px rgba(255, 180, 84, 0.42);
  }

  .beat-dot.active { background: #f2f5fa; box-shadow: 0 0 14px rgba(255, 255, 255, 0.5); }
  .beat-dot.accent.active { background: var(--accent); box-shadow: 0 0 18px rgba(255, 180, 84, 0.78); }

  .beat-dot.hit { animation: dotHit 0.28s ease-out; }
  .beat-dot.accent.hit { animation: dotHitAccent 0.32s ease-out; }
  .beat-dot.subhit { animation: dotSubHit 0.22s ease-out; }

  @keyframes dotHit {
    0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.5); }
    100% { box-shadow: 0 0 0 12px rgba(255, 255, 255, 0); }
  }
  @keyframes dotHitAccent {
    0% { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.62); }
    100% { box-shadow: 0 0 0 15px rgba(255, 180, 84, 0); }
  }
  @keyframes dotSubHit {
    0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.24), 0 0 10px rgba(255, 255, 255, 0.2); }
    100% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); }
  }

  .dial-inner {
    position: absolute;
    inset: 16%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background:
      radial-gradient(circle at 50% 26%, rgba(255, 255, 255, 0.055), transparent 58%),
      linear-gradient(180deg, #171c24, #0f1319);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.05),
      inset 0 -18px 42px rgba(0, 0, 0, 0.45),
      0 18px 40px rgba(0, 0, 0, 0.35);
    user-select: none;
  }

  .dial-inner::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.16),
      0 0 30px rgba(255, 255, 255, 0.10);
  }

  .dial-inner.pulse::after { animation: dialRingPulse 0.24s ease-out; }
  .dial-inner.pulse-accent::after { animation: dialRingPulseAccent 0.32s ease-out; }

  @keyframes dialRingPulse {
    0% { opacity: 0.85; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.055); }
  }

  @keyframes dialRingPulseAccent {
    0% {
      opacity: 1;
      transform: scale(1);
      box-shadow:
        inset 0 0 0 1px rgba(255, 180, 84, 0.55),
        0 0 44px rgba(255, 180, 84, 0.20);
    }
    100% { opacity: 0; transform: scale(1.065); }
  }

  .bpm-value {
    font-size: clamp(48px, 15vw, 66px);
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  .bpm-unit {
    margin-top: 7px;
    margin-left: 0.28em;
    font-size: 9px;
    font-weight: 650;
    letter-spacing: 0.28em;
    color: var(--dim);
  }

  .tempo-name {
    margin-top: 11px;
    min-height: 16px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* ---------- controls ---------- */

  .tempo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 9px;
  }

  .icon-btn {
    flex: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.035);
    color: #cfd6e2;
    font-size: 20px;
    line-height: 1;
    transition: background 0.15s ease, transform 0.08s ease, border-color 0.15s ease;
  }

  .icon-btn:hover { background: rgba(255, 255, 255, 0.065); border-color: rgba(255, 255, 255, 0.13); }
  .icon-btn:active { transform: scale(0.94); }

  .slider-wrap { flex: 1; min-width: 0; }

  input[type="range"] {
    --track-h: 6px;
    --thumb-size: 20px;
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: var(--thumb-size);
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    outline: none;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: var(--track-h);
    border-radius: 999px;
    background: linear-gradient(
      to right,
      var(--accent) 0 var(--fill, 50%),
      rgba(255, 255, 255, 0.09) var(--fill, 50%) 100%
    );
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    box-sizing: border-box;
    width: var(--thumb-size);
    height: var(--thumb-size);
    margin-top: -7px;
    border-radius: 50%;
    background: #0e1116;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 180, 84, 0.10);
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }

  input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(255, 180, 84, 0.14); }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.06); }

  input[type="range"]::-moz-range-track {
    height: var(--track-h);
    border-radius: 999px;
    background: linear-gradient(
      to right,
      var(--accent) 0 var(--fill, 50%),
      rgba(255, 255, 255, 0.09) var(--fill, 50%) 100%
    );
  }

  input[type="range"]::-moz-range-thumb {
    box-sizing: border-box;
    width: var(--thumb-size);
    height: var(--thumb-size);
    border-radius: 50%;
    background: #0e1116;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 180, 84, 0.10);
  }

  .scale {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    padding: 0 1px;
    font-size: 9.5px;
    letter-spacing: 0.04em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  .tap-btn {
    width: 100%;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-bottom: 18px;
    border-radius: 13px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
    color: #cfd6e2;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .tap-btn:hover { background: rgba(255, 255, 255, 0.055); border-color: rgba(255, 255, 255, 0.12); }

  .tap-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 9px rgba(255, 180, 84, 0.65);
  }

  .tap-btn.flash { animation: tapFlash 0.26s ease-out; }
  @keyframes tapFlash {
    0% { background: rgba(255, 180, 84, 0.20); border-color: rgba(255, 180, 84, 0.45); }
    100% { background: rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.08); }
  }

  .settings {
    display: grid;
    grid-template-columns: 1fr 1.25fr;
    gap: 12px;
    margin-bottom: 4px;
  }

  .field { min-width: 0; }

  .field-label {
    display: block;
    margin: 0 0 7px 2px;
    font-size: 10.5px;
    font-weight: 550;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .select-wrap { position: relative; }

  .select-wrap::after {
    content: "";
    position: absolute;
    right: 15px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid #8b95a7;
    border-bottom: 1.5px solid #8b95a7;
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .select {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 42px;
    padding: 0 32px 0 13px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.035);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .seg {
    display: flex;
    gap: 3px;
    height: 42px;
    padding: 3px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.035);
  }

  .seg button {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #98a2b3;
    font-size: 12.5px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .seg button:hover { color: #cfd6e2; background: rgba(255, 255, 255, 0.04); }

  .seg button.active {
    background: var(--accent-soft);
    color: var(--accent-strong);
    box-shadow: inset 0 0 0 1px rgba(255, 180, 84, 0.16);
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 18px 2px 20px;
  }

  .switch-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: #aab3c2;
    cursor: pointer;
    user-select: none;
  }

  .switch-row input {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    pointer-events: none;
  }

  .switch {
    position: relative;
    flex: none;
    width: 40px;
    height: 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    transition: background 0.18s ease;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #7c8698;
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .switch-row input:checked + .switch { background: rgba(255, 180, 84, 0.85); }
  .switch-row input:checked + .switch::after { transform: translateX(16px); background: #1b1305; }
  .switch-row input:focus-visible + .switch { outline: 2px solid rgba(255, 180, 84, 0.65); outline-offset: 2px; }

  .volume {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    flex: 1;
    min-width: 0;
    color: var(--dim);
  }

  .volume svg { flex: none; width: 16px; height: 16px; }

  .volume input[type="range"] {
    --track-h: 4px;
    --thumb-size: 15px;
    flex: 1;
    max-width: 130px;
    height: var(--thumb-size);
  }

  .volume input[type="range"]::-webkit-slider-thumb {
    margin-top: -5.5px;
    border-width: 1.5px;
    box-shadow: none;
  }

  .volume input[type="range"]::-moz-range-thumb {
    border-width: 1.5px;
    box-shadow: none;
  }

  .start-btn {
    width: 100%;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    border: 0;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--accent-strong), #f3a43b);
    color: #1a1206;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    box-shadow:
      0 14px 34px rgba(243, 164, 59, 0.26),
      inset 0 1px 0 rgba(255, 255, 255, 0.42);
    transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .start-btn:hover {
    transform: translateY(-1px);
    box-shadow:
      0 18px 40px rgba(243, 164, 59, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.42);
  }

  .start-btn:active { transform: translateY(0) scale(0.985); }

  .start-btn.running {
    background: linear-gradient(180deg, #ff7e6b, #ef5844);
    box-shadow:
      0 14px 34px rgba(239, 88, 68, 0.26),
      inset 0 1px 0 rgba(255, 255, 255, 0.30);
  }

  .start-btn.running:hover {
    box-shadow:
      0 18px 40px rgba(239, 88, 68, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.30);
  }

  .btn-icon {
    width: 0;
    height: 0;
    border-left: 13px solid currentColor;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    margin-left: 2px;
  }

  .start-btn.running .btn-icon {
    width: 12px;
    height: 12px;
    margin-left: 0;
    border: 0;
    border-radius: 3px;
    background: currentColor;
  }

  .footnote {
    margin: 14px 0 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #525b6b;
  }

  .footnote b { color: #707b8d; font-weight: 600; }

  @media (max-width: 400px) {
    .app { padding: 22px 16px 18px; border-radius: 26px; }
    .dial { margin-bottom: 20px; }
    .tempo-row { gap: 10px; }
    .icon-btn { width: 42px; height: 42px; }
    .bottom-row { margin: 16px 1px 18px; }
    .start-btn { height: 54px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">♩</span>
      <div>
        <h1>节拍器</h1>
        <p>METRONOME</p>
      </div>
    </div>
    <kbd>SPACE</kbd>
  </header>

  <div class="dial" id="dial">
    <div class="ticks" aria-hidden="true"></div>
    <div class="beat-ring" id="beatRing" aria-hidden="true"></div>
    <div class="dial-inner" id="dialInner">
      <div class="bpm-value" id="bpmDisplay">100</div>
      <div class="bpm-unit">BPM</div>
      <div class="tempo-name" id="tempoName">Moderato 中板</div>
    </div>
  </div>

  <section class="tempo-row" aria-label="速度控制">
    <button type="button" class="icon-btn" id="minusBtn" aria-label="降低速度" title="降低速度">−</button>
    <div class="slider-wrap">
      <input type="range" id="bpmSlider" min="30" max="300" step="1" value="100" aria-label="每分钟节拍数">
      <div class="scale"><span>30</span><span>120</span><span>300</span></div>
    </div>
    <button type="button" class="icon-btn" id="plusBtn" aria-label="提高速度" title="提高速度">+</button>
  </section>

  <button type="button" class="tap-btn" id="tapBtn" title="连续点击，取平均速度">
    <span class="tap-dot" aria-hidden="true"></span>
    <span>TAP 敲击定速</span>
  </button>

  <section class="settings">
    <div class="field">
      <span class="field-label" id="beatsLabel">每小节拍数</span>
      <div class="select-wrap">
        <select class="select" id="beatsSelect" aria-labelledby="beatsLabel"></select>
      </div>
    </div>
    <div class="field">
      <span class="field-label" id="subLabel">每拍细分</span>
      <div class="seg" id="subdivisionSeg" role="group" aria-labelledby="subLabel">
        <button type="button" data-sub="1" class="active" title="每拍 1 下">1</button>
        <button type="button" data-sub="2" title="每拍 2 下">2</button>
        <button type="button" data-sub="3" title="三连音">3</button>
        <button type="button" data-sub="4" title="每拍 4 下">4</button>
      </div>
    </div>
  </section>

  <section class="bottom-row">
    <label class="switch-row">
      <input type="checkbox" id="accentToggle" checked>
      <span class="switch" aria-hidden="true"></span>
      <span>重音</span>
    </label>
    <div class="volume">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"></path>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
        <path d="M18.5 6a8.5 8.5 0 0 1 0 12"></path>
      </svg>
      <input type="range" id="volumeSlider" min="0" max="100" step="1" value="70" aria-label="音量">
    </div>
  </section>

  <button type="button" class="start-btn" id="startBtn" aria-label="开始节拍器" aria-pressed="false">
    <span class="btn-icon" aria-hidden="true"></span>
    <span id="startLabel">开始</span>
  </button>

  <p class="footnote"><b>空格</b> 开始 / 暂停 &nbsp;·&nbsp; <b>↑ ↓</b> 调整速度 &nbsp;·&nbsp; <b>T</b> 敲击</p>
</main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'metronome.settings.v1';
  var MIN_BPM = 30;
  var MAX_BPM = 300;
  var LOOKAHEAD_MS = 25;
  var SCHEDULE_AHEAD = 0.12;

  function $(id) { return document.getElementById(id); }

  var dial = $('dial');
  var dialInner = $('dialInner');
  var beatRing = $('beatRing');
  var bpmDisplay = $('bpmDisplay');
  var tempoNameEl = $('tempoName');
  var bpmSlider = $('bpmSlider');
  var beatsSelect = $('beatsSelect');
  var subdivisionSeg = $('subdivisionSeg');
  var accentToggle = $('accentToggle');
  var volumeSlider = $('volumeSlider');
  var startBtn = $('startBtn');
  var startLabel = $('startLabel');
  var tapBtn = $('tapBtn');

  var state = {
    bpm: 100,
    beats: 4,
    subdivision: 1,
    accent: true,
    volume: 70,
    running: false
  };

  var dots = [];
  var ctx = null;
  var master = null;
  var noiseBuf = null;
  var visualQueue = [];
  var subCounter = 0;
  var nextNoteTime = 0;
  var tickWorker = null;
  var fallbackTimer = null;
  var rafId = null;
  var tapTimes = [];

  function clampBpm(value) {
    return Math.min(MAX_BPM, Math.max(MIN_BPM, Math.round(value)));
  }

  function tempoName(bpm) {
    if (bpm < 60) return 'Largo 广板';
    if (bpm < 76) return 'Adagio 柔板';
    if (bpm < 108) return 'Andante 行板';
    if (bpm < 120) return 'Moderato 中板';
    if (bpm < 168) return 'Allegro 快板';
    if (bpm < 200) return 'Presto 急板';
    return 'Prestissimo 最急板';
  }

  /* ---------- persistence ---------- */

  function loadSettings() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== 'object') return;
      if (Number.isFinite(saved.bpm)) state.bpm = clampBpm(saved.bpm);
      if (Number.isInteger(saved.beats) && saved.beats >= 1 && saved.beats <= 12) state.beats = saved.beats;
      if ([1, 2, 3, 4].indexOf(saved.subdivision) !== -1) state.subdivision = saved.subdivision;
      if (typeof saved.accent === 'boolean') state.accent = saved.accent;
      if (Number.isFinite(saved.volume)) state.volume = Math.min(100, Math.max(0, Math.round(saved.volume)));
    } catch (err) { /* storage unavailable, use defaults */ }
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        bpm: state.bpm,
        beats: state.beats,
        subdivision: state.subdivision,
        accent: state.accent,
        volume: state.volume
      }));
    } catch (err) { /* storage unavailable, ignore */ }
  }

  /* ---------- UI helpers ---------- */

  function paintRange(input) {
    var min = Number(input.min);
    var max = Number(input.max);
    var pct = ((Number(input.value) - min) / (max - min)) * 100;
    input.style.setProperty('--fill', pct + '%');
  }

  function setBpm(value) {
    state.bpm = clampBpm(value);
    bpmDisplay.textContent = String(state.bpm);
    tempoNameEl.textContent = tempoName(state.bpm);
    bpmSlider.value = String(state.bpm);
    paintRange(bpmSlider);
    saveSettings();
  }

  function buildDots() {
    beatRing.innerHTML = '';
    dots = [];
    var count = state.beats;
    for (var i = 0; i < count; i++) {
      var dot = document.createElement('div');
      dot.className = 'beat-dot' + (i === 0 ? ' accent' : '');
      dot.style.setProperty('--angle', (-90 + (360 / count) * i) + 'deg');
      beatRing.appendChild(dot);
      dots.push(dot);
    }
  }

  function updateStartButton() {
    startBtn.classList.toggle('running', state.running);
    startBtn.setAttribute('aria-pressed', String(state.running));
    startBtn.setAttribute('aria-label', state.running ? '暂停节拍器' : '开始节拍器');
    startLabel.textContent = state.running ? '暂停' : '开始';
  }

  /* ---------- audio ---------- */

  function makeNoise(context) {
    var length = Math.floor(context.sampleRate * 0.05);
    var buffer = context.createBuffer(1, length, context.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  function volumeGain(volume) {
    return Math.pow(volume / 100, 1.4);
  }

  function ensureAudio() {
    if (!ctx) {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return false;
      ctx = new AudioCtor();
      master = ctx.createGain();
      master.gain.value = volumeGain(state.volume);
      master.connect(ctx.destination);
      noiseBuf = makeNoise(ctx);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }

  function scheduleClick(time, kind) {
    if (!ctx || !master) return;

    var isAccent = kind === 'accent';
    var isSub = kind === 'sub';
    var freq = isAccent ? 1600 : (isSub ? 740 : 1120);
    var peak = isAccent ? 0.9 : (isSub ? 0.3 : 0.55);
    var dur = isAccent ? 0.085 : (isSub ? 0.045 : 0.06);

    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, time);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.82, time + dur);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(peak, time + 0.0015);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(time);
    osc.stop(time + dur + 0.02);

    if (noiseBuf) {
      var src = ctx.createBufferSource();
      var noiseGain = ctx.createGain();
      var highpass = ctx.createBiquadFilter();
      src.buffer = noiseBuf;
      highpass.type = 'highpass';
      highpass.frequency.value = 2600;
      noiseGain.gain.setValueAtTime(peak * 0.45, time);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.018);
      src.connect(highpass);
      highpass.connect(noiseGain);
      noiseGain.connect(master);
      src.start(time);
      src.stop(time + 0.025);
    }
  }

  /* ---------- transport ---------- */

  function scheduler() {
    if (!state.running || !ctx) return;

    var secondsPerBeat = 60 / state.bpm;
    var subdivision = Math.max(1, state.subdivision);
    var beats = Math.max(1, state.beats);

    while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
      var subPos = subCounter % subdivision;
      var beat = Math.floor(subCounter / subdivision) % beats;
      var kind = subPos !== 0 ? 'sub' : (beat === 0 && state.accent ? 'accent' : 'normal');

      scheduleClick(nextNoteTime, kind);
      visualQueue.push({
        time: nextNoteTime,
        beat: beat,
        sub: subPos !== 0,
        accent: kind === 'accent'
      });

      nextNoteTime += secondsPerBeat / subdivision;
      subCounter++;
    }
  }

  function startClock() {
    stopClock();
    try {
      if (!tickWorker) {
        var code = 'let timer=null;self.onmessage=function(e){if(e.data==="start"){if(timer===null){timer=setInterval(function(){self.postMessage("tick");},25);}}else if(e.data==="stop"){if(timer!==null){clearInterval(timer);timer=null;}}};';
        var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        tickWorker = new Worker(url);
        URL.revokeObjectURL(url);
        tickWorker.onmessage = function () { scheduler(); };
        tickWorker.onerror = function () {
          try { tickWorker.terminate(); } catch (err) { /* ignore */ }
          tickWorker = null;
          if (state.running && !fallbackTimer) {
            fallbackTimer = setInterval(scheduler, LOOKAHEAD_MS);
          }
        };
      }
      tickWorker.postMessage('start');
    } catch (err) {
      tickWorker = null;
      if (!fallbackTimer) fallbackTimer = setInterval(scheduler, LOOKAHEAD_MS);
    }
  }

  function stopClock() {
    if (tickWorker) {
      try { tickWorker.postMessage('stop'); } catch (err) { /* ignore */ }
    }
    if (fallbackTimer) {
      clearInterval(fallbackTimer);
      fallbackTimer = null;
    }
  }

  function paintBeat(evt) {
    if (evt.sub) {
      var subDot = dots[evt.beat];
      if (subDot) {
        subDot.classList.remove('subhit');
        void subDot.offsetWidth;
        subDot.classList.add('subhit');
      }
      return;
    }

    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.remove('active', 'hit');
    }

    var dot = dots[evt.beat];
    if (dot) {
      dot.classList.add('active');
      void dot.offsetWidth;
      dot.classList.add('hit');
    }

    dialInner.classList.remove('pulse', 'pulse-accent');
    void dialInner.offsetWidth;
    dialInner.classList.add(evt.accent ? 'pulse-accent' : 'pulse');
  }

  function visualLoop() {
    if (!state.running || !ctx) return;

    var now = ctx.currentTime;
    var latest = null;
    while (visualQueue.length && visualQueue[0].time <= now) {
      latest = visualQueue.shift();
    }
    if (latest) paintBeat(latest);

    rafId = requestAnimationFrame(visualLoop);
  }

  function startTransport() {
    if (state.running) return;
    if (!ensureAudio()) return;

    state.running = true;
    subCounter = 0;
    visualQueue = [];
    nextNoteTime = ctx.currentTime + 0.08;

    startClock();
    scheduler();
    dial.classList.add('running');
    updateStartButton();

    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(visualLoop);
  }

  function stopTransport() {
    if (!state.running) return;

    state.running = false;
    stopClock();
    visualQueue = [];
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.remove('active', 'hit', 'subhit');
    }
    dialInner.classList.remove('pulse', 'pulse-accent');
    dial.classList.remove('running');
    updateStartButton();
  }

  function toggleTransport() {
    if (state.running) stopTransport();
    else startTransport();
  }

  /* ---------- tap tempo ---------- */

  function handleTap() {
    var now = performance.now();
    tapTimes = tapTimes.filter(function (t) { return now - t < 2000; });
    tapTimes.push(now);

    tapBtn.classList.remove('flash');
    void tapBtn.offsetWidth;
    tapBtn.classList.add('flash');

    if (tapTimes.length < 2) return;
    var intervals = [];
    for (var i = 1; i < tapTimes.length; i++) {
      intervals.push(tapTimes[i] - tapTimes[i - 1]);
    }
    var avg = intervals.reduce(function (a, b) { return a + b; }, 0) / intervals.length;
    if (avg > 0) setBpm(60000 / avg);
  }

  /* ---------- events ---------- */

  bpmSlider.addEventListener('input', function () {
    setBpm(Number(bpmSlider.value));
  });

  $('minusBtn').addEventListener('click', function () { setBpm(state.bpm - 1); });
  $('plusBtn').addEventListener('click', function () { setBpm(state.bpm + 1); });

  tapBtn.addEventListener('click', handleTap);

  beatsSelect.addEventListener('change', function () {
    state.beats = Number(beatsSelect.value);
    buildDots();
    saveSettings();
  });

  subdivisionSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-sub]');
    if (!btn) return;
    state.subdivision = Number(btn.dataset.sub);
    var children = subdivisionSeg.querySelectorAll('button');
    for (var i = 0; i < children.length; i++) {
      children[i].classList.toggle('active', children[i] === btn);
    }
    saveSettings();
  });

  accentToggle.addEventListener('change', function () {
    state.accent = accentToggle.checked;
    saveSettings();
  });

  volumeSlider.addEventListener('input', function () {
    state.volume = Number(volumeSlider.value);
    paintRange(volumeSlider);
    if (master && ctx) {
      master.gain.setTargetAtTime(volumeGain(state.volume), ctx.currentTime, 0.02);
    }
    saveSettings();
  });

  startBtn.addEventListener('click', function () {
    toggleTransport();
    startBtn.blur();
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) btn.blur();
  });

  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName ? e.target.tagName : '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

    if (e.code === 'Space') {
      if (tag === 'BUTTON') return;
      e.preventDefault();
      toggleTransport();
      return;
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      setBpm(state.bpm + (e.shiftKey ? 10 : 1));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      setBpm(state.bpm - (e.shiftKey ? 10 : 1));
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      setBpm(state.bpm + (e.shiftKey ? 10 : 5));
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      setBpm(state.bpm - (e.shiftKey ? 10 : 5));
    } else if (e.key === 't' || e.key === 'T') {
      handleTap();
    }
  });

  /* ---------- init ---------- */

  function init() {
    loadSettings();

    for (var i = 1; i <= 12; i++) {
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = i + ' 拍';
      beatsSelect.appendChild(opt);
    }

    beatsSelect.value = String(state.beats);
    accentToggle.checked = state.accent;
    volumeSlider.value = String(state.volume);
    paintRange(volumeSlider);

    var subButtons = subdivisionSeg.querySelectorAll('button');
    for (var j = 0; j < subButtons.length; j++) {
      subButtons[j].classList.toggle('active', Number(subButtons[j].dataset.sub) === state.subdivision);
    }

    buildDots();
    setBpm(state.bpm);
    updateStartButton();
  }

  init();
})();
</script>
</body>
</html>
