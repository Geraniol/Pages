<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#232323">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>价格时钟</title>
<style>
  :root{
    --bg:#232323;
    --seg:#8c8c8c;
    --seg-peak:#ffa733;
    --ink:#f4f4f4;
    --dim:#9a9a9a;
    --stage:min(92vmin, 820px);
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

  /* 圆环：viewBox 以原点为中心，1 单位 = stage/320 */
  .stage{position:relative; width:var(--stage); height:var(--stage)}
  svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .seg{fill:var(--seg); transition:fill .4s}
  .seg.peak{fill:var(--seg-peak)}
  #needle{fill:#fff;
    filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 11px rgba(255,255,255,.55))}
  .tick{fill:#8a8a8a; font-size:9.2px; text-anchor:middle; dominant-baseline:central;
    font-family:var(--mono)}

  /* 环内文字堆叠 */
  .face{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .bj{font-size:calc(var(--stage)*.023); letter-spacing:.09em; color:var(--ink); line-height:1}
  /* 三行小字同字号同色，只有间距不同 */
  .bjzone,.lzone,.gmt{font-size:calc(var(--stage)*.0195); letter-spacing:.09em;
    color:var(--dim); line-height:1}
  .bjzone{margin-top:calc(var(--stage)*.016)}
  .lzone{margin-top:calc(var(--stage)*.018)}
  .gmt{margin-top:calc(var(--stage)*.006)}
  /* 细体大数字：Consolas 没有细字重，这里换到 Segoe UI Light */
  .big{font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-variant-numeric:tabular-nums;
    font-size:calc(var(--stage)*.145); font-weight:200; letter-spacing:.03em; line-height:1;
    margin-top:calc(var(--stage)*.050); color:#fbfbfb}
  .date{font-size:calc(var(--stage)*.0225); letter-spacing:.05em; color:#d8d8d8;
    line-height:1; margin-top:calc(var(--stage)*.062)}
</style>
</head>
<body>
<main class="stage">
  <svg viewBox="-160 -160 320 320" aria-hidden="true">
    <g id="segs"></g>
    <g>
      <text class="tick" x="0" y="-133">00</text>
      <text class="tick" x="133" y="0">06</text>
      <text class="tick" x="0" y="133">12</text>
      <text class="tick" x="-133" y="0">18</text>
    </g>
    <rect id="needle" x="-3.5" y="-113" width="7" height="26" rx="3.5"/>
  </svg>

  <div class="face">
    <div class="bj mono" id="bjTime">--:--</div>
    <div class="bjzone mono" id="bjZone">Asia/Shanghai</div>
    <div class="big" id="bigTime">--:--</div>
    <div class="date mono" id="date">—</div>
    <div class="lzone mono" id="localZone">—</div>
    <div class="gmt mono" id="gmtLabel">—</div>
  </div>
</main>

<script>
(function () {
  'use strict';

  var BJ = 'Asia/Shanghai';
  var NS = 'http://www.w3.org/2000/svg';

  // 环几何（单位同 viewBox）
  var R_IN = 90, R_OUT = 110;        // 环带宽 20
  var HALF = 6.3;                    // 每块弧长的半角（度），24 块 → 间距 15 度
  var CR = 6;                        // 四角圆角

  // ---------- 环上的一块 ----------
  // 环扇形：外弧 + 内弧 + 四个圆角，用采样折线写出。不能用旋转矩形拼 —— 矩形外缘
  // 是直线弦，相邻两块之间会露三角缝；折线也不依赖 SVG 圆弧的 sweep 标志。
  function sectorPath(rIn, rOut, a0, a1, cr) {
    var DEG = Math.PI / 180;
    var pt = function (r, deg) {
      var a = deg * DEG;
      return [r * Math.sin(a), -r * Math.cos(a)];
    };
    var sOut = Math.asin(cr / (rOut - cr)) / DEG;   // 外圆切点相对圆角中心的角差
    var sIn = Math.asin(cr / (rIn + cr)) / DEG;
    var tOut = Math.sqrt((rOut - cr) * (rOut - cr) - cr * cr);  // 半径线上的切点半径
    var tIn = Math.sqrt((rIn + cr) * (rIn + cr) - cr * cr);

    var pts = [];
    // 圆角终点与圆弧起点是同一个点，这里去重，免得留下零长度边
    var push = function (p) {
      var q = pts[pts.length - 1];
      if (q && Math.abs(q[0] - p[0]) < 1e-6 && Math.abs(q[1] - p[1]) < 1e-6) return;
      pts.push(p);
    };
    var arc = function (r, from, to, n) {
      for (var i = 0; i <= n; i++) push(pt(r, from + (to - from) * i / n));
    };
    // 从当前最后一点沿半径 cr 的圆角弧走到 to
    var fillet = function (rCenter, angCenter, to, n) {
      var c = pt(rCenter, angCenter);
      var p0 = pts[pts.length - 1];
      var a0v = Math.atan2(p0[1] - c[1], p0[0] - c[0]);
      var a1v = Math.atan2(to[1] - c[1], to[0] - c[0]);
      var sweep = a1v - a0v;
      while (sweep > Math.PI) sweep -= 2 * Math.PI;
      while (sweep < -Math.PI) sweep += 2 * Math.PI;
      for (var i = 1; i <= n; i++) {
        var a = a0v + sweep * i / n;
        push([c[0] + cr * Math.cos(a), c[1] + cr * Math.sin(a)]);
      }
    };

    push(pt(rOut, a0 + sOut));                     // 外弧起点
    arc(rOut, a0 + sOut, a1 - sOut, 14);           // 外弧
    fillet(rOut - cr, a1 - sOut, pt(tOut, a1), 8); // 外端圆角
    push(pt(tIn, a1));                             // 沿半径向内
    fillet(rIn + cr, a1 - sIn, pt(rIn, a1 - sIn), 8);
    arc(rIn, a1 - sIn, a0 + sIn, 14);              // 内弧
    fillet(rIn + cr, a0 + sIn, pt(tIn, a0), 8);
    push(pt(tOut, a0));                            // 沿半径向外
    fillet(rOut - cr, a0 + sOut, pt(rOut, a0 + sOut), 8);

    return 'M' + pts.map(function (p) {
      return p[0].toFixed(2) + ',' + p[1].toFixed(2);
    }).join('L') + 'Z';
  }

  // ---------- 北京墙上时间 ----------
  // 把「北京的墙上时间」编码成 UTC 毫秒的虚拟时间轴，便于比较与取整
  var bjFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: BJ, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  function bjMs(date) {
    var p = {};
    bjFmt.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  }

  // 高峰（标准价）：北京时间周一至周五 09:00-12:00、14:00-18:00；其余时段（含周末全天）
  // 为空闲时段，空闲价是高峰价的一半。按用户要求不处理中国法定节假日 —— 法定假日若落在
  // 周一至周五，环上仍会按高峰点亮。
  function isPeak(v) {
    var d = new Date(v), day = d.getUTCDay(), h = d.getUTCHours();
    if (day === 0 || day === 6) return false;
    return (h >= 9 && h < 12) || (h >= 14 && h < 18);
  }

  // 本地某小时（取该小时中点）落到北京时是什么时段
  function localHourIsPeak(now, h) {
    return isPeak(bjMs(new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, 30, 0)));
  }

  // ---------- 本地时间 ----------
  var LOCAL_ZONE = (function () {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local'; }
    catch (e) { return 'Local'; }
  })();
  var WEEKDAY = new Intl.DateTimeFormat('en-US', { weekday: 'long' });

  function gmtLabel() {
    var off = -new Date().getTimezoneOffset(), s = off < 0 ? '-' : '+';
    off = Math.abs(off);
    var h = Math.floor(off / 60), m = off % 60;
    return 'GMT' + s + h + (m ? ':' + String(m).padStart(2, '0') : '');
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  // ---------- 环 ----------
  // 一块代表时段 [i, i+1) 而不是时间点，所以整块偏半格（+7.5 度）：00/06/12/18 的
  // 刻度线正好落在两块之间的缝隙上，指针也始终落在当前小时那一块里。
  // 24 块形状完全相同，只差旋转角，所以路径只算一次。
  var segPath = sectorPath(R_IN, R_OUT, -HALF, HALF, CR);
  var segsG = document.getElementById('segs');
  var SEG = [];
  for (var i = 0; i < 24; i++) {
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', segPath);
    p.setAttribute('transform', 'rotate(' + (i * 15 + 7.5) + ')');
    p.setAttribute('class', 'seg');
    segsG.appendChild(p);
    SEG.push(p);
  }

  var needle = document.getElementById('needle');
  var el = {
    bjTime: document.getElementById('bjTime'),
    bjZone: document.getElementById('bjZone'),
    bigTime: document.getElementById('bigTime'),
    date: document.getElementById('date'),
    localZone: document.getElementById('localZone'),
    gmtLabel: document.getElementById('gmtLabel')
  };
  el.bjZone.textContent = BJ;
  el.localZone.textContent = LOCAL_ZONE;
  el.gmtLabel.textContent = gmtLabel();

  // 环的峰谷只随本地日期变化，不必每帧重算
  var ringKey = null;

  function render() {
    var now = new Date();
    var v = bjMs(now);              // 北京墙上时间
    var bd = new Date(v);

    el.bjTime.textContent = pad(bd.getUTCHours()) + ':' + pad(bd.getUTCMinutes());
    el.bigTime.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    el.date.textContent = now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate()) +
      ' ' + WEEKDAY.format(now);

    // 环：橙色 = 换算到本地后的北京高峰窗口
    var key = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if (key !== ringKey) {
      ringKey = key;
      for (var h = 0; h < 24; h++) {
        SEG[h].setAttribute('class', 'seg' + (localHourIsPeak(now, h) ? ' peak' : ''));
      }
    }

    // 指针：本地一天的比例
    var sec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;
    needle.setAttribute('transform', 'rotate(' + (sec / 86400 * 360).toFixed(3) + ')');
  }

  render();
  // 屏幕上最快变化的也只是「分钟」，1 秒一跳足够；指针一秒只走 0.004 度
  setInterval(render, 1000);
})();
</script>
</body>
</html>
