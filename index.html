<style>
/* 尺寸全部由一个变量 --w 推导：设计稿可见页宽 451 / 画布 551，所以正文列宽取 82vw，
   方砖 4 列、砖间距 0.0871 * 列宽（= 稿子的 39.3 / 451），字号一律按砖宽的比例给。
   手机上因此正好复现稿子的比例（390 宽 -> 四列 59px 的砖、12px 说明字），
   桌面端把列宽封在 520px，整体等比放大而不是换一种排法。 */
:root{
  --bg:#000;
  --fg:#fff;
  --line:#fff;
  --muted:rgba(255,255,255,.55);
  --hover:rgba(255,255,255,.12);
  --w:clamp(296px,82vw,520px);
  --gap:calc(var(--w) * .0871);
  --tile:calc((var(--w) - 3 * var(--gap)) / 4);
  --hair:clamp(2px,calc(var(--w) * .0088),4px);
  --cap:calc(var(--w) * .0368);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;
  /* 滚动条隐藏，但槽位钉住：筛选到只剩一两个项目时页面变短、滚动条会消失，
     整页跟着横跳一下。所以常驻滚动容器，只把滚动条本身画成全透明。
     （实测：不钉槽位时 900px 宽视口下会横跳约 8px，钉住后为 0） */
  overflow-y:scroll;
  scrollbar-color:transparent transparent;          /* Firefox：轨道与滑块全透明 */
}
html::-webkit-scrollbar{width:12px;height:12px}
html::-webkit-scrollbar-track,html::-webkit-scrollbar-thumb{background:transparent;border:0}
html::-webkit-scrollbar-button{display:none}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--fg);
  font:400 15px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:var(--w);margin:0 auto;
  padding:clamp(56px,10.4vh,170px) 0 64px;
}

/* 题头 */
.brand{display:flex;align-items:center;gap:calc(var(--w) * .042)}
.mark{
  flex:none;display:grid;place-items:center;
  width:var(--tile);height:var(--tile);
  border:var(--hair) solid var(--line);border-radius:25.6%;
}
.mark svg{width:44%;height:44%}
h1{font-size:calc(var(--w) * .1023);font-weight:400;line-height:1.1;letter-spacing:.01em}
.host{margin-top:2px;font-size:calc(var(--w) * .0412);color:var(--muted)}

/* 分类 */
.chips{
  display:flex;flex-wrap:wrap;
  gap:calc(var(--w) * .029) calc(var(--w) * .0623);
  margin-top:clamp(40px,9.6vh,96px);
}
.chip{
  display:inline-flex;align-items:center;
  gap:calc(var(--tile) * .108);
  padding:calc(var(--tile) * .051) calc(var(--tile) * .1325);
  border:clamp(2px,calc(var(--w) * .0088),3px) solid var(--line);
  border-radius:999px;
  background:none;color:inherit;cursor:pointer;
  font:400 var(--cap)/1.2 var(--font);
  transition:background-color .18s,color .18s;
}
.chip svg{width:calc(var(--tile) * .289);height:calc(var(--tile) * .289)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* 网格 */
.grid{
  list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);
  margin-top:clamp(32px,6.2vh,64px);
}
.tile{display:block;color:inherit;text-decoration:none;border-radius:calc(var(--tile) * .256)}
.box{
  display:grid;place-items:center;aspect-ratio:1;
  border:var(--hair) solid var(--line);border-radius:25.6%;
  transition:background-color .18s;
}
.box svg{width:44%;height:44%}
.cap{display:block;margin-top:calc(var(--tile) * .123);text-align:center;font-size:var(--cap);line-height:1.3}
.tile:hover .box,.tile:focus-visible .box{background:var(--hover)}
.tile:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.empty{margin-top:clamp(32px,6.2vh,64px);font-size:var(--cap);color:var(--muted)}
[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
<noscript><style>.chips{display:none}</style></noscript>
</head>

<script>
(function () {
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var items = Array.prototype.slice.call(document.querySelectorAll('#grid > li'));
  var empty = document.getElementById('empty');
  var active = '';

  function render() {
    var shown = 0;
    items.forEach(function (li) {
      var hit = !active || li.dataset.cat === active;
      li.hidden = !hit;
      if (hit) shown++;
    });
    empty.hidden = shown > 0;
    chips.forEach(function (chip) {
      chip.setAttribute('aria-pressed', String(chip.dataset.cat === active));
    });
  }

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var cat = chip.dataset.cat;
      active = active === cat ? '' : cat;
      render();
    });
  });

  render();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
